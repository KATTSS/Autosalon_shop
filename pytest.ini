[pytest]
DJANGO_SETTINGS_MODULE = autosalon.settings
python_files = test_*.py
addopts = --strict-markers --cov --cov-report=term-missing --cov-report=html --cov-report=xml
markers =
    unit: isolated logic with mocked dependencies, without database access
    integration: interaction with Django ORM, HTTP client or HTTP transport stubs
    scenario: successive actions and business state transitions (also integration)
